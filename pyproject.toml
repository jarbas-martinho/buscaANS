[project]
name = "buscaans"
version = "1.1.2"
description = "Coletor de novas legislações da ANS que publica um feed RSS"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["requests>=2.31", "tzdata>=2024.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

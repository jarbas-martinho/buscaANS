name: Coletar legislações da ANS

on:
  schedule:
    - cron: "*/30 * * * *"   # a cada 30 minutos (UTC); o GitHub pode atrasar alguns minutos
  workflow_dispatch:

concurrency:
  group: coletar
  cancel-in-progress: false

permissions:
  contents: write   # commitar estado e feed
  actions: write    # manter o agendamento ativo (ver último passo)

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar
        run: pip install -e ".[dev]"

      - name: Testes
        run: pytest -q

      - name: Coletar
        run: python -m buscaans

      - name: Commitar novidades
        run: |
          if git diff --quiet -- data docs; then
            echo "Sem novidades."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git commit -m "Coleta: novas legislações ($(date -u +%Y-%m-%dT%H:%MZ))"
          git pull --rebase origin main
          git push

      # O GitHub desativa agendamentos de repositórios públicos após 60 dias sem atividade.
      # Reativar o próprio workflow a cada execução zera essa contagem.
      - name: Manter agendamento ativo
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/coletar.yml/enable"

name: Coletar legislações da ANS

on:
  schedule:
    # 09:17, 13:17 e 18:17 de Brasília (12:17, 16:17 e 21:17 UTC). Minuto fora da hora cheia de propósito:
    # na hora cheia o GitHub atrasa ou descarta execuções agendadas por excesso de carga.
    - cron: "17 12,16,21 * * *"
  workflow_dispatch:
    inputs:
      reenviar:
        description: "Autonumbers que devem voltar ao feed como novos, separados por vírgula (ex.: 23651)"
        required: false
        default: ""

concurrency:
  group: coletar
  cancel-in-progress: false

permissions:
  contents: write   # commitar estado e feed
  actions: write    # manter o agendamento ativo (ver último passo)

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar
        run: pip install -e ".[dev]"

      - name: Testes
        run: pytest -q

      - name: Coletar
        env:
          REENVIAR: ${{ inputs.reenviar }}
        run: python -m buscaans --reenviar "$REENVIAR"

      - name: Commitar novidades
        run: |
          if git diff --quiet -- data docs; then
            echo "Sem novidades."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git commit -m "Coleta: novas legislações ($(date -u +%Y-%m-%dT%H:%MZ))"
          git pull --rebase origin main
          git push

      # O GitHub desativa agendamentos de repositórios públicos após 60 dias sem atividade.
      # Reativar o próprio workflow a cada execução zera essa contagem.
      - name: Manter agendamento ativo
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/coletar.yml/enable"

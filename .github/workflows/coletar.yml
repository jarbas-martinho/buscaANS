name: Coletar legislações da ANS

on:
  schedule:
    # 09:17, 13:17 e 18:17 de Brasília (12:17, 16:17 e 21:17 UTC). Minuto fora da hora cheia de propósito:
    # na hora cheia o GitHub atrasa ou descarta execuções agendadas por excesso de carga.
    - cron: "17 12,16,21 * * *"
  workflow_dispatch:
    inputs:
      reenviar:
        description: "Autonumbers que devem voltar ao feed como novos, separados por vírgula (ex.: 23651)"
        required: false
        default: ""
      aprovar_lote:
        description: "Código exato do lote bloqueado, após revisar o resumo da execução"
        required: false
        default: ""

concurrency:
  group: coletar
  cancel-in-progress: false

permissions:
  contents: write   # commitar estado e feed
  actions: write    # manter o agendamento ativo e reexecutar publicação do Pages que falhou

jobs:
  coletar:
    runs-on: ubuntu-latest
    # Inclui a espera pela publicação do feed (config [pages] espera_minutos, padrão 20).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar
        run: pip install -e ".[dev]"

      - name: Testes
        run: pytest -q

      # Se a publicação anterior do Pages falhou (ex.: travou e foi cancelada), pede a reexecução.
      - name: Conferir publicação anterior
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m buscaans.pages verificar

      - name: Coletar
        env:
          REENVIAR: ${{ inputs.reenviar }}
          APROVAR_LOTE: ${{ inputs.aprovar_lote }}
        run: python -m buscaans --reenviar "$REENVIAR" --aprovar-lote "$APROVAR_LOTE"

      - name: Commitar novidades
        id: commit
        run: |
          if git diff --quiet -- data docs; then
            echo "Sem novidades."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git commit -m "Coleta: novas legislações ($(date -u +%Y-%m-%dT%H:%MZ))"
          git pull --rebase origin main
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Espera o Pages publicar este commit; reexecuta uma vez se falhar. Se ainda assim não publicar,
      # a execução falha para o GitHub avisar por e-mail.
      - name: Confirmar publicação do feed
        if: steps.commit.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m buscaans.pages aguardar --sha "${{ steps.commit.outputs.sha }}"

      # O GitHub desativa agendamentos de repositórios públicos após 60 dias sem atividade.
      # Reativar o próprio workflow a cada execução zera essa contagem.
      - name: Manter agendamento ativo
        if: ${{ !cancelled() && github.event_name == 'schedule' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/coletar.yml/enable"
